<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crisol</title>
<style>
  body { font: 14px "Segoe UI", sans-serif; margin: 12px; }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  header span { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; height: 32px; }
  .row .name { flex: 1; }
</style>
</head>
<body>
<header><span id="connection"></span><button id="all"></button></header>
<div id="rows"></div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  // The words of the page; a real one would pick them by the language of Windows.
  const words = { start: "Start", stop: "Stop", startAll: "Start all", stopAll: "Stop all" };
  let current = { any_running: false, services: [], text: "" };

  function render(state) {
    current = state;
    document.getElementById("connection").textContent = state.text;
    document.getElementById("all").textContent = state.any_running ? words.stopAll : words.startAll;
    const rows = document.getElementById("rows");
    rows.replaceChildren(...state.services.map((s) => {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = s.name;
      const status = document.createElement("span");
      status.textContent = s.detail ? `${s.state} (${s.detail})` : s.state;
      const start = document.createElement("button");
      start.textContent = words.start;
      start.onclick = () => invoke("start", { service: s.name });
      const stop = document.createElement("button");
      stop.textContent = words.stop;
      stop.onclick = () => invoke("stop", { service: s.name });
      row.append(name, status, start, stop);
      return row;
    }));
  }

  document.getElementById("all").onclick = () =>
    invoke(current.any_running ? "stop" : "start", { service: null });
  listen("state", (event) => render(event.payload));
  invoke("state").then(render);
</script>
</body>
</html>
