[package]
name = "crisol-gui-tauri-proto"
version = "0.1.0"
edition = "2021"
publish = false

# Outside the Crisol workspace on purpose (F13.2): `cargo test --workspace` never builds it.
[workspace]

[features]
# What `tauri build` turns on: the page is embedded in the executable instead of loaded from a
# development server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
serde_json = "1.0.154"
crisol-client = { path = "../../src/crisol-client" }
crisol-protocol = { path = "../../src/crisol-protocol" }

[build-dependencies]
tauri-build = "2.7.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
