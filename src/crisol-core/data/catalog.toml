# Memcached on Windows (F9 review, ADR-0017). The project publishes no Windows build. This is the
# third-party build of `jefyt/memcached-windows` (memcached 1.6.8 of 2020, compiled with MinGW and
# LibreSSL in 2026): old, no longer patched, hence `end_of_life`, and lower certainty than the other
# services: the release carries a `hashes.txt` (SHA-256 and SHA-512) and GitHub records the same
# SHA-256, but both come from the same account, so they only prove the transfer, not who built it.
[[package]]
service = "memcached"
version = "1.6.8"
