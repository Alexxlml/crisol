# Redis on Windows (F9.3, ADR-0017). There is no official build. Two alternatives that share port
# 6379 (only one runs at a time): `redis`, the unofficial port of the original Redis by
# tporadowski (5.0.14.1, February 2022, no longer patched, so `end_of_life`), whose releases carry
# no hash or signature (the SHA-256 is identical on two downloads: lower certainty), and `garnet`,
# Microsoft's server that speaks Redis's protocol (not Redis), whose release assets carry the
# SHA-256 GitHub records.
[[package]]
