# PostgreSQL (F9.2). The PostgreSQL project links its Windows binaries to EDB (EnterpriseDB), who
# publish them at get.enterprisedb.com. EDB publishes NO hash and NO signature for them, and the
# executables are not Authenticode-signed: these hashes were computed on a download over HTTPS and
# are identical on two separate downloads. That is integrity of the transfer, not authenticity
# against the provider (lower certainty, like PHP 7.4; analisis/fuentes-binarios.md). The archive
# carries the server under `pgsql/` (and pgAdmin, which is why it is so large).
[[package]]
service = "postgresql"
version = "17.11"
os = "windows"
arch = "x86_64"
url = "https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64-binaries.zip"
