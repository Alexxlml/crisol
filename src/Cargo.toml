[workspace]
resolver = "2"
members = [
    "crisol-core",
    "crisol-platform",
    "crisol-protocol",
    "crisol-daemon",
    "crisol-cli",
    "crisol-shim",
    "crisol-elevate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_ignored = "0.1.14"
serde_json = "1.0.154"
base64 = "0.23.1"
toml_edit = "0.25.17"
windows = "0.62.2"
minisign-verify = "0.3.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.18.1"
time = "0.3.55"
getrandom = "0.4.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
insta = "1.49.0"
crisol-core = { path = "crisol-core" }
crisol-platform = { path = "crisol-platform" }
crisol-protocol = { path = "crisol-protocol" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
