      <stop offset="100%" stop-color="#C9361F"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#141110"/>
  <g transform="translate(24 24) scale(0.78) translate(-24 -26.5)">
    <path d="M10.8 20 L37.2 20 L34.6 37.5 Q34.2 39 32.5 39 L15.5 39 Q13.8 39 13.4 37.5 Z" fill="url(#molten)"/>
